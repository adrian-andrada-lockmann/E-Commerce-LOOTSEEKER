<article class="product-card">
    <a class="product-card__media" href="{% url 'product_detail' product.category.slug product.slug %}">
        {% if product.image %}
            <img src="{{ product.get_thumbnail }}" alt="Image of {{ product.title }}">
        {% else %}
            <img src="/media/notfound.png" alt="No product image available">
        {% endif %}
    </a>
    <div class="product-card__body">
        <a class="product-card__category" href="{% url 'category_detail' product.category.slug %}">
            {{ product.category }}
        </a>
        <h3>
            <a href="{% url 'product_detail' product.category.slug product.slug %}">{{ product.title }}</a>
        </h3>
        <p class="product-card__seller">
            Seller:
            <a href="{% url 'vendor_detail' product.user.id %}">
                {% firstof product.user.get_full_name product.user.username %}
            </a>
        </p>
        <div class="product-card__footer">
            <strong>${{ product.get_display_price }}</strong>
            <a class="button button-small" href="{% url 'add_to_cart' product.id %}">Add to cart</a>
        </div>
    </div>
</article>
